<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Flight Tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e3a8a">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#eef1f5; --panel:rgba(255,255,255,.95); --text:#18202c; --muted:#677285; --line:#dde2ea;
  --chip:#f1f4f8; --accent:#2563eb; --warn:#b45309; --bad:#b91c1c; --good:#15803d;
  --shadow:0 8px 28px rgba(15,23,42,.14);
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:rgba(22,26,33,.94); --text:#e6e9ef; --muted:#8d97a8; --line:#2b313c;
  --chip:#232934; --accent:#6ea0ff; --warn:#f0a85a; --bad:#f87171; --good:#4ade80;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13.5px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font:inherit}
#planes{position:absolute;top:0;left:0;z-index:450;pointer-events:none}
.panel{position:absolute;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#top{top:12px;left:12px;width:330px;padding:14px 14px 12px}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h1 .live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
h1 .live.off{background:var(--muted);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
#count{color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.search{margin-top:10px;position:relative}
.qrow{display:flex;gap:6px}
.qbtn{flex:none;padding:0 12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.qbtn:disabled{opacity:.6;cursor:default}
.search input{flex:1;min-width:0;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--chip);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.qmsg{font-size:12px;color:var(--muted);margin-top:6px}
.qmsg:empty{display:none}
.qmsg a{color:var(--accent)}
.row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);
  cursor:pointer;user-select:none;font-size:12.5px;color:var(--text)}
.tog input{margin:0;accent-color:var(--accent)}
.tog.on{border-color:var(--accent);color:var(--accent)}
button.tog{font:inherit;font-size:12.5px}
.filters{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--chip);display:grid;gap:9px}
.filters[hidden]{display:none}
.fl{display:grid;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fl > span{float:right}
.fl input[type=text],.fl input:not([type]){font:inherit;font-size:13px;text-transform:none;letter-spacing:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);outline:none}
.fl input:focus{border-color:var(--accent)}
#altLbl{text-transform:none;letter-spacing:0;color:var(--text);font-weight:600;margin-left:6px}
.dual{position:relative;height:22px}
.dual::before{content:"";position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:var(--line)}
.dual i{position:absolute;top:10px;height:3px;border-radius:2px;background:var(--accent)}
.dual input{position:absolute;left:0;top:3px;width:100%;margin:0;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;height:16px}
.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
.dual input::-moz-range-track{background:none}
.seg{display:flex;gap:6px;text-transform:none;letter-spacing:0}
.seg label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text);padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer}
.seg input{margin:0;accent-color:var(--accent)}
.fnote{font-size:11.5px;color:var(--muted)}
.fnote:empty{display:none}
#freset{justify-self:start}
.legend.air{flex-wrap:wrap;gap:4px 10px}
.legend.air .k{display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.legend.air .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.meter{margin-top:2px}
.meter:empty{display:none}
.mrow{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.mbar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;min-width:40px}
.mbar i{display:block;height:100%;background:var(--good)}
.mbar.warn i{background:var(--warn)}
.mbar.full i{background:var(--bad)}
.status{margin-top:10px;font-size:12px;color:var(--muted);display:grid;gap:3px}
.status b{color:var(--text);font-weight:600}
.status .err{color:var(--warn)}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend .bar{flex:1;height:6px;border-radius:3px}
#collapse{position:absolute;top:12px;right:12px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;display:none}
#info{top:12px;right:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;display:none}
#info.open{display:block}
.ihead{padding:14px 14px 10px;position:relative;border-bottom:1px solid var(--line)}
.ihead .cs{font-size:22px;font-weight:700;letter-spacing:.01em}
.ihead .cs .iata{font-size:14px;font-weight:600;color:var(--muted)}
.ihead .logo{display:block;height:30px;max-width:150px;object-fit:contain;object-position:left;margin-bottom:8px;background:#fff;border-radius:6px;padding:3px 6px}
.tm .late{color:var(--warn)}
.profile{padding:8px 14px 6px}
.profile:empty{display:none}
.ptitle{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.ptitle span{text-transform:none;letter-spacing:0;color:var(--text);font-weight:600}
.pnote{font-size:12px;color:var(--muted);margin-top:2px}
svg.prof{display:block;width:100%;height:104px;margin-top:4px;overflow:visible;touch-action:none}
.prof .pg{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.prof .pl{fill:var(--muted);font-size:9px}
.prof .pt{fill:var(--text);font-size:9.5px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.prof .pa{fill:var(--accent);opacity:.14}
.prof .pline{fill:none;stroke:var(--accent);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.prof .pdot{fill:var(--accent);stroke:var(--panel);stroke-width:1.5}
.prof .ph{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.apsec{padding:10px 14px;border-bottom:1px solid var(--line)}
.apt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.apt span{background:var(--chip);border-radius:999px;padding:0 7px;color:var(--text);letter-spacing:0}
.aprow{display:flex;align-items:baseline;gap:8px;width:100%;padding:6px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
.aprow:first-of-type{border-top:0}
.aprow:hover b{color:var(--accent)}
.aprow .w{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aprow .r{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.apchips{display:flex;flex-wrap:wrap;gap:5px}
.apchip{font:inherit;font-size:11.5px;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--text);cursor:pointer}
.trackmsg{font-size:12px;color:var(--muted);padding:0 14px 10px;margin-top:-2px}
.trackmsg:empty{display:none}
.trackmsg button{font:inherit;font-size:12px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:7px;padding:4px 8px;cursor:pointer;margin-top:4px}
.ihead .al{color:var(--muted);margin-top:1px}
.close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--chip);
  color:var(--text);cursor:pointer;font-size:15px;line-height:1}
.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--chip)}
.route{padding:12px 14px;border-bottom:1px solid var(--line)}
.ap{display:flex;justify-content:space-between;gap:10px}
.ap > div{min-width:0}
.ap .code{font-size:20px;font-weight:700}
.ap .city{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .r{text-align:right}
.tm{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.tm b{color:var(--text);font-weight:600}
.prog{position:relative;height:4px;background:var(--line);border-radius:2px;margin:10px 0 4px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.prog .pl{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);margin-top:6px}
.note.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.grid > div{background:var(--panel);padding:9px 14px}
.grid .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ifoot{padding:10px 14px;font-size:11.5px;color:var(--muted)}
.ifoot a{color:var(--accent)}
#tip{position:absolute;z-index:1100;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:5px 8px;font-size:12px;box-shadow:var(--shadow);display:none;white-space:nowrap}
#tip b{font-weight:650}
.skel{color:var(--muted)}
.leaflet-control-attribution{font-size:10px;background:var(--panel)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--text);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--chip)}
@media (max-width:700px){
  #top{left:8px;right:8px;top:8px;width:auto;padding:12px}
  #top.min .body{display:none}
  #collapse{display:block}
  #info{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:58%}
  .photo{aspect-ratio:21/9}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="panel">
  <h1><span class="live off" id="liveDot"></span>Flight Tracker</h1>
  <button id="collapse" aria-label="Collapse panel">&#9662;</button>
  <div id="count">Loading aircraft</div>
  <div class="body">
    <form class="search" id="qform" role="search" autocomplete="off">
      <div class="qrow"><input id="q" type="search" enterkeyhint="search" placeholder="Flight, airport or tail number" autocomplete="off" spellcheck="false" aria-label="Find a flight"><button type="submit" class="qbtn">Find</button></div>
      <div id="qmsg" class="qmsg" aria-live="polite"></div>
    </form>
    <div class="row">
      <label class="tog"><input type="checkbox" id="fAir" checked> Airlines only</label>
      <label class="tog"><input type="checkbox" id="fGnd" checked> On ground</label>
      <button class="tog" id="theme" type="button">Dark map</button>
      <button class="tog" id="fbtn" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
    </div>
    <div id="filters" class="filters" hidden>
      <label class="fl">Airline<input id="fAirline" list="airlineList" placeholder="Any airline: name or code" autocomplete="off" spellcheck="false"></label>
      <datalist id="airlineList"></datalist>
      <label class="fl">Aircraft type<input id="fType" list="typeList" placeholder="Any type, e.g. B738, or A35 for all A350s" autocomplete="off" spellcheck="false"></label>
      <datalist id="typeList"></datalist>
      <div class="fl">Altitude <span id="altLbl">Any</span>
        <div class="dual"><i id="altFill"></i><input type="range" id="altMin" min="0" max="45000" step="1000" value="0" aria-label="Lowest altitude"><input type="range" id="altMax" min="0" max="45000" step="1000" value="45000" aria-label="Highest altitude"></div>
      </div>
      <div class="fl">Color planes by
        <div class="seg"><label><input type="radio" name="colorBy" value="alt" checked> Altitude</label><label><input type="radio" name="colorBy" value="airline"> Airline</label></div>
      </div>
      <div class="fnote" id="fnote"></div>
      <button type="button" class="tog" id="freset">Reset filters</button>
    </div>
    <div class="legend" id="legend"><span>Gnd</span><span class="bar" id="lbar"></span><span>45k ft</span></div>
    <div class="status">
      <div id="sGlobal">Global feed: connecting</div>
      <div id="sLive">Zoom in for live updates every 5 seconds</div>
      <div id="sMeter" class="meter"></div>
    </div>
  </div>
</div>

<div id="info" class="panel" aria-live="polite"></div>
<div id="tip"></div>

<script src="/api/config"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

/* ---------- config ---------- */
// The CARTO basemaps key comes from the CARTO_KEY environment variable in your
// Cloudflare Pages settings (served by functions/api/config.js), so this file
// never needs editing. Without it, keyless Esri gray canvas tiles are used.
const CARTO_KEY = window.FT_CONFIG?.cartoKey || "";
const API_STATES = "/api/states";
const API_LOOKUP = "/api/lookup";
const API_FLIGHT = "/api/flight";
const ADSBDB = "https://api.adsbdb.com/v0/";
const REGIONAL = [
  { name: "adsb.lol",       url: (la, lo, r) => `https://api.adsb.lol/v2/point/${la}/${lo}/${r}` },
  { name: "airplanes.live", url: (la, lo, r) => `https://api.airplanes.live/v2/point/${la}/${lo}/${r}` },
  // Same feeds fetched by your own site, for when the browser can't reach them directly.
  { name: "site relay", url: (la, lo, r) => `/api/live?lat=${la}&lon=${lo}&r=${r}`, relay: true },
];
const REGIONAL_MIN_ZOOM = 6;
const REGIONAL_EVERY = 5000;
const MAX_EXTRAP = 600;           // seconds of dead reckoning before a plane freezes
const M_FT = 3.28084, MS_KT = 1.943844, MS_FPM = 196.8504, R_NM = 3440.065;
const NON_AIRLINE = new Set(["RCH","RRR","CNV","PAT","SAM","VVF","CFC","ASY","GAF","IAM","FAF","BAF","HKY","CTM","RFF","PLF","MMF","AME","NAF","SHF","EJA","LXJ","XOJ","VJT","EJM","JRE","TWY"]);

/* ---------- state ---------- */
const planes = new Map();         // hex -> plane
let gid = 0;
const gMeta = { ok: false, fetched: 0, ttl: 0, auth: false, err: "", stale: false, n: 0 };
const rMeta = { active: false, ok: false, at: 0, src: "", err: "", backoff: 0, fails: 0, pref: 0 };
const ui = { airlinesOnly: true, showGround: true, q: "", selected: null, airport: null, dark: false };
const lookups = new Map();

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n) => Math.round(n).toLocaleString();
// For searching: lowercase, without accents or special letters, so
// "Aeroméxico" = "aeromexico", "Zürich" = "zurich", "Łódź" = "lodz".
const FOLD = { "ø": "o", "æ": "ae", "œ": "oe", "ß": "ss", "ł": "l", "đ": "d", "ð": "d", "þ": "th", "ı": "i", "ħ": "h" };
const fold = (s) => String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[øæœßłđðþıħ]/g, (c) => FOLD[c]);
const rad = (d) => (d * Math.PI) / 180, deg = (r) => (r * 180) / Math.PI;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  return m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago";
}
function distNm(la1, lo1, la2, lo2) {
  const a = Math.sin(rad(la2 - la1) / 2) ** 2 + Math.cos(rad(la1)) * Math.cos(rad(la2)) * Math.sin(rad(lo2 - lo1) / 2) ** 2;
  return 2 * R_NM * Math.asin(Math.min(1, Math.sqrt(a)));
}
function project(lat, lon, brgDeg, dNm) {
  const d = dNm / R_NM, b = rad(brgDeg), p1 = rad(lat), l1 = rad(lon);
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [deg(p2), ((deg(l2) + 540) % 360) - 180];
}
function greatCircle(a, b, n = 96) {
  const [p1, l1, p2, l2] = [rad(a[0]), rad(a[1]), rad(b[0]), rad(b[1])];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
  if (!d) return [a, b];
  const pts = [];
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
    const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2);
    const y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2);
    const z = A * Math.sin(p1) + B * Math.sin(p2);
    let lon = deg(Math.atan2(y, x));
    if (prev != null) while (lon - prev > 180) lon -= 360;
    if (prev != null) while (prev - lon > 180) lon += 360;
    prev = lon;
    pts.push([deg(Math.atan2(z, Math.hypot(x, y))), lon]);
  }
  return pts;
}
function isAirline(cs) {
  return /^[A-Z]{3}[0-9][0-9A-Z]{0,4}$/.test(cs || "") && !NON_AIRLINE.has(cs.slice(0, 3));
}

/* ---------- altitude colors ---------- */
const STOPS = [[0, [232, 89, 12]], [10000, [245, 159, 0]], [20000, [64, 192, 87]], [30000, [21, 170, 191]], [38000, [66, 99, 235]], [45000, [156, 54, 181]]];
const COLORS = [];
for (let ft = 0; ft <= 45000; ft += 500) {
  let i = 0;
  while (i < STOPS.length - 2 && ft > STOPS[i + 1][0]) i++;
  const [a, ca] = STOPS[i], [b, cb] = STOPS[i + 1];
  const t = Math.min(1, Math.max(0, (ft - a) / (b - a)));
  COLORS.push(`rgb(${ca.map((c, k) => Math.round(c + (cb[k] - c) * t)).join(",")})`);
}
const GROUND = "#98a2b3";
function altColor(p) {
  if (p.gnd) return GROUND;
  if (p.alt == null) return COLORS[0];
  return COLORS[Math.min(COLORS.length - 1, Math.max(0, Math.round(p.alt / 500)))];
}
const LEGEND_BG = `linear-gradient(90deg,${GROUND} 0 6%,${STOPS.map((s, i) => `rgb(${s[1]}) ${6 + (s[0] / 45000) * 94}%`).join(",")})`;
$("#lbar").style.background = LEGEND_BG;

/* ---------- map ---------- */
const hash = parseHash();
const map = L.map("map", {
  zoomControl: false, worldCopyJump: true, minZoom: 2, maxZoom: 13,
  center: hash ? [hash.lat, hash.lon] : [34, -40], zoom: hash ? hash.z : 3,
});

map.attributionControl.setPrefix(false);

/* ---------- altitude profile ----------
   Altitude over time for the selected flight, from the snapshot job's
   recordings, FlightAware's track when loaded, and live updates. */
function profileData(p) {
  const pts = [];
  for (const q of p.hist || []) if (q[3] != null) pts.push([q[0], q[3], q[4] ?? null]);
  for (const q of p.prof || []) if (q[1] != null) pts.push(q);
  // The current reading, on a 15 second step so the chart isn't redrawn every second.
  if (!p.synthetic && p.alt != null) pts.push([Math.floor(Date.now() / 15000) * 15, p.gnd ? 0 : Math.round(p.alt / 100) * 100, p.gs != null ? Math.round(p.gs) : null]);
  pts.sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const q of pts) { const l = out[out.length - 1]; if (!l || q[0] - l[0] >= 15) out.push(q); else if (q === pts[pts.length - 1]) out[out.length - 1] = q; }
  return out;
}
const PW = 312, PH = 104, PL = 34, PR = 8, PT = 8, PB = 18;
function renderProfile(p) {
  const el = $("#profile");
  if (!el) return;
  const d = profileData(p);
  const key = d.length + ":" + (d[d.length - 1]?.join(",") || "");
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  if (d.length < 3 || d[d.length - 1][0] - d[0][0] < 300) {
    el.innerHTML = p.synthetic ? "" : `<div class="ptitle">Altitude</div><div class="pnote">The altitude chart fills in as positions are recorded.</div>`;
    return;
  }
  const t0 = d[0][0], t1 = d[d.length - 1][0];
  const maxAlt = Math.max(10000, Math.ceil(Math.max(...d.map((q) => q[1])) / 10000) * 10000);
  const X = (t) => PL + ((t - t0) / Math.max(1, t1 - t0)) * (PW - PL - PR);
  const Y = (a) => PT + (1 - a / maxAlt) * (PH - PT - PB);
  let line = "", area = "", segStart = null;
  for (let i = 0; i < d.length; i++) {
    const [t, a] = d[i];
    const gap = i > 0 && t - d[i - 1][0] > 25 * 60; // no data for a while: break the line
    if (i === 0 || gap) {
      if (segStart != null) area += `L${X(d[i - 1][0]).toFixed(1)},${Y(0)}L${X(segStart).toFixed(1)},${Y(0)}Z`;
      line += `M${X(t).toFixed(1)},${Y(a).toFixed(1)}`; area += `M${X(t).toFixed(1)},${Y(a).toFixed(1)}`; segStart = t;
    } else { line += `L${X(t).toFixed(1)},${Y(a).toFixed(1)}`; area += `L${X(t).toFixed(1)},${Y(a).toFixed(1)}`; }
  }
  area += `L${X(t1).toFixed(1)},${Y(0)}L${X(segStart).toFixed(1)},${Y(0)}Z`;
  let grid = "";
  for (let a = 0; a <= maxAlt; a += maxAlt > 30000 ? 10000 : 5000) {
    grid += `<line x1="${PL}" x2="${PW - PR}" y1="${Y(a)}" y2="${Y(a)}" class="pg"/><text x="${PL - 4}" y="${Y(a) + 3}" class="pl" text-anchor="end">${a ? a / 1000 + "k" : "0"}</text>`;
  }
  const last = d[d.length - 1];
  el.innerHTML = `<div class="ptitle">Altitude<span>${last[1] ? nf(last[1]) + " ft" : "On ground"}${last[2] ? " &middot; " + nf(last[2]) + " kt" : ""}</span></div>
    <svg class="prof" viewBox="0 0 ${PW} ${PH}" preserveAspectRatio="none" role="img" aria-label="Altitude over the flight">
      ${grid}
      <path d="${area}" class="pa"/><path d="${line}" class="pline"/>
      <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3" class="pdot"/>
      <text x="${PL}" y="${PH - 4}" class="pl">${fmtTime(t0 * 1000)}</text>
      <text x="${PW - PR}" y="${PH - 4}" class="pl" text-anchor="end">Now</text>
      <g id="phover"></g>
    </svg>`;
  el._d = d; el._x = X; el._y = Y; el._t = [t0, t1];
}
// Hover on the chart: show the altitude and speed at that moment.
document.addEventListener("pointermove", (e) => {
  const svg = e.target.closest?.("svg.prof");
  const el = $("#profile");
  if (!el?._d) return;
  const g = el.querySelector("#phover");
  if (!svg) { if (g?.innerHTML) g.innerHTML = ""; return; }
  const r = svg.getBoundingClientRect(), vx = ((e.clientX - r.left) / r.width) * PW;
  const [t0, t1] = el._t, t = t0 + ((vx - PL) / (PW - PL - PR)) * (t1 - t0);
  let best = el._d[0];
  for (const q of el._d) if (Math.abs(q[0] - t) < Math.abs(best[0] - t)) best = q;
  const x = el._x(best[0]), y = el._y(best[1]), right = x > PW * 0.6;
  g.innerHTML = `<line x1="${x}" x2="${x}" y1="${PT}" y2="${PH - PB}" class="ph"/><circle cx="${x}" cy="${y}" r="3" class="pdot"/>
    <text x="${right ? x - 5 : x + 5}" y="${PT + 9}" class="pt" text-anchor="${right ? "end" : "start"}">${best[1] ? nf(best[1]) + " ft" : "Ground"}${best[2] ? ", " + nf(best[2]) + " kt" : ""}, ${fmtTime(best[0] * 1000)}</text>`;
});

// Say when the recorded path doesn't reach back to takeoff, and offer FlightAware's track.
function renderTrackMsg(p) {

  let html = "";
  if (p.faTrackLimited) html = `FlightAware's ${p.faTrackLimited === "month" ? "monthly" : "daily"} lookup limit was reached, so its track couldn't be loaded.`;
  else if (p.faTrackAsked && !complete && h?.length) html = "";
  else if (p.faTrackAsked) html = complete ? "" : "Loading FlightAware's track...";
  else if (o && !complete && !p.gnd) {
    const what = startNm == null ? "No receiver recorded this flight's path yet." : `Receivers first recorded this flight ${nf(startNm)} nm from ${esc(o.iata || o.icao)}.`;
    const units = p.lk?.faTrackUnits || 3;

/* ---------- status ---------- */

/* ---------- filters ----------
   Airline, aircraft type and altitude, plus coloring by airline. Saved in this

Object.assign(ui, { fAirline: "", fType: "", altMin: 0, altMax: 45000, colorBy: "alt" });
const fEls = { airline: $("#fAirline"), type: $("#fType"), min: $("#altMin"), max: $("#altMax") };
// "UAL", "UA", "United", or a picked suggestion like "UAL · United Airlines" -> "UAL"
function parseAirline(v) {
  v = (v || "").trim();
  if (!v) return "";
  const t = v.split(/[\s·]+/)[0].toUpperCase();
  if (/^[A-Z]{3}$/.test(t) && (!airlinesData || airlinesData[t])) return t;
  if (/^[A-Z0-9]{2}$/.test(t) && airlinesByIata?.[t]) return airlinesByIata[t];
  const low = fold(v);
  if (airlinesData) {
    // Prefer an airline that's actually flying right now.
    const counts = new Map();
    for (const p of planes.values()) if (isAirline(p.cs)) counts.set(p.cs.slice(0, 3), (counts.get(p.cs.slice(0, 3)) || 0) + 1);
    let best = null, bc = -1;
    for (const [icao, [, name]] of Object.entries(airlinesData)) {
      if (!fold(name).includes(low)) continue;
      const c = counts.get(icao) || 0;
      if (c > bc) { bc = c; best = icao; }
    }
    if (best) return best;
  }

}

function applyFilters(save = true) {
  ui.fAirline = parseAirline(fEls.airline.value);
  ui.fType = fEls.type.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  let lo = +fEls.min.value, hi = +fEls.max.value;
  if (lo > hi) [lo, hi] = [hi, lo];
  ui.altMin = lo; ui.altMax = hi;
  $("#altLbl").textContent = lo === 0 && hi === 45000 ? "Any" : `${altText(lo)} to ${hi === 45000 ? "45k+" : altText(hi)} ft`;
  const fill = $("#altFill");
  fill.style.left = (lo / 45000) * 100 + "%"; fill.style.width = ((hi - lo) / 45000) * 100 + "%";
  const n = (ui.fAirline ? 1 : 0) + (ui.fType ? 1 : 0) + (lo > 0 || hi < 45000 ? 1 : 0);
  $("#fbtn").textContent = n ? `Filters (${n})` : "Filters";
  $("#fbtn").classList.toggle("on", n > 0);
  // Explain what the filters can and can't see.
  const notes = [];
  if (ui.fAirline) {
    const name = airlinesData?.[ui.fAirline]?.[1];
    notes.push(name ? `Airline: ${esc(name)} (${ui.fAirline}).` : `Airline code ${ui.fAirline}.`);
  } else if (fEls.airline.value.trim()) notes.push("No airline matches that name.");
  if (ui.fType) {
    let known = 0, all = 0;
    for (const p of planes.values()) { all++; if (p.type) known++; }
    notes.push(`Aircraft type is known for ${nf(known)} of ${nf(all)} aircraft (it comes from adsb.fi and the live feed, not OpenSky), so this shows only those.`);
  }
  $("#fnote").innerHTML = notes.join(" ");
  if (save) store.set("ft-filters", JSON.stringify({ a: fEls.airline.value, t: fEls.type.value, lo, hi, c: ui.colorBy }));
  updateLegend();
  queueDraw();
  setTimeout(updateStatus, 80); // refresh "Showing X of Y" right after the redraw
  if (ui.airport) renderAirport();
}
for (const el of [fEls.airline, fEls.type]) el.addEventListener("input", () => applyFilters());
for (const el of [fEls.min, fEls.max]) el.addEventListener("input", () => applyFilters());
document.querySelectorAll('input[name="colorBy"]').forEach((r) => r.addEventListener("change", (e) => { ui.colorBy = e.target.value; applyFilters(); }));
$("#freset").addEventListener("click", () => {
  fEls.airline.value = ""; fEls.type.value = ""; fEls.min.value = 0; fEls.max.value = 45000;
  ui.colorBy = "alt"; document.querySelector('input[name="colorBy"][value="alt"]').checked = true;
  applyFilters();
});
$("#fbtn").addEventListener("click", () => {
  const f = $("#filters"), open = f.hidden;
  f.hidden = !open;
  $("#fbtn").setAttribute("aria-expanded", String(open));
  if (open) refreshFilterLists();
});
// Suggestions: airlines and types currently on the map, most common first.
let listsAt = 0;
function refreshFilterLists() {
  if ($("#filters").hidden || Date.now() - listsAt < 20000) return;
  listsAt = Date.now();
  const al = new Map(), ty = new Map();
  for (const p of planes.values()) {
    if (isAirline(p.cs)) al.set(p.cs.slice(0, 3), (al.get(p.cs.slice(0, 3)) || 0) + 1);
    if (p.type) ty.set(p.type.toUpperCase(), (ty.get(p.type.toUpperCase()) || 0) + 1);
  }
  $("#airlineList").innerHTML = [...al].sort((a, b) => b[1] - a[1]).slice(0, 250)
    .map(([k, n]) => {
      const name = airlinesData?.[k]?.[1] || "", plain = fold(name);
      const alias = name && plain !== name.toLowerCase() ? ` (${esc(plain)})` : "";
      return `<option value="${esc(k)}${name ? " · " + esc(name) : ""}">${nf(n)} on the map${alias}</option>`;
    }).join("");
  $("#typeList").innerHTML = [...ty].sort((a, b) => b[1] - a[1]).slice(0, 200)
    .map(([k, n]) => `<option value="${esc(k)}">${nf(n)} on the map</option>`).join("");
}
// The key under the filters: altitude scale, or the airlines in view.
let keyAt = 0, keyTop = [];
function updateAirlineKey(inView) {
  if (Date.now() - keyAt < 2000) return;
  keyAt = Date.now();
  keyTop = [...inView].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k]) => k);
  updateLegend();
}
function updateLegend() {
  const lg = $("#legend");
  if (ui.colorBy !== "airline") {
    if (lg.classList.contains("air")) {
      lg.classList.remove("air");
      lg.innerHTML = `<span>Gnd</span><span class="bar" id="lbar"></span><span>45k ft</span>`;
      $("#lbar").style.background = LEGEND_BG;
    }
    return;
  }
  lg.classList.add("air");
  lg.innerHTML = keyTop.length
    ? keyTop.map((k) => `<span class="k" title="${esc(airlinesData?.[k]?.[1] || k)}"><i style="background:${airlineColor({ cs: k + "1" })}"></i>${esc(k)}</span>`).join("") + `<span class="k"><i style="background:${GROUND}"></i>Other</span>`
    : "Airline colors appear as planes load.";
}
// Restore saved filters.
try {
  const f = JSON.parse(store.get("ft-filters") || "null");
  if (f) {
    fEls.airline.value = f.a || ""; fEls.type.value = f.t || "";
    fEls.min.value = f.lo ?? 0; fEls.max.value = f.hi ?? 45000;
    ui.colorBy = f.c === "airline" ? "airline" : "alt";
    document.querySelector(`input[name="colorBy"][value="${ui.colorBy}"]`).checked = true;
  }
} catch {}
loadAirlines().then(() => applyFilters(false));
applyFilters(false);

/* ---------- FlightAware usage meter ----------
   Today's and this month's lookups against the limits. Reading it is free. */
let meterU = null;
function noteUsage(j) {
  const u = j?.usage;
  if (!u) return;
  // Answers reused from cache can carry older counts; keep the higher one.
  if (!meterU || u.month >= meterU.month || u.day >= meterU.day) { meterU = u; renderMeter(); }
}
async function refreshMeter() {
  try {
    const r = await fetch(`${API_FLIGHT}?usage=1`, { cache: "no-store" });
    if (!(r.headers.get("content-type") || "").includes("json")) return;
    const j = await r.json();
    if (j.enabled && j.usage) { meterU = j.usage; renderMeter(); }
  } catch {}
}
function renderMeter() {
  const el = $("#sMeter"), u = meterU;
  if (!u) { el.innerHTML = ""; return; }
  const now = new Date();
  const nextDay = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
  const nextMonth = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1));
  const dp = u.day / u.dayLimit, mp = u.month / u.monthLimit;
  const cls = (x) => (x >= 1 ? "full" : x >= 0.8 ? "warn" : "");
  const bar = (x) => `<span class="mbar ${cls(x)}"><i style="width:${Math.min(100, x * 100).toFixed(0)}%"></i></span>`;
  const note = mp >= 1
    ? `<span class="err">Monthly limit reached, resets ${nextMonth.toLocaleDateString([], { month: "short", day: "numeric" })}</span>`
    : dp >= 1 ? `<span class="err">Daily limit reached, resets ${fmtTime(nextDay)}</span>`
    : `Resets ${fmtTime(nextDay)}. Flight details use 1, a full path ${u.trackUnits}.`;
  el.innerHTML = `<div class="mrow" title="FlightAware lookups used today"><b>FlightAware</b> ${u.day}/${u.dayLimit} today ${bar(dp)}</div>
    <div class="mrow" title="FlightAware lookups used this month">${nf(u.month)}/${nf(u.monthLimit)} this month ${bar(mp)}</div>
    <div>${note}</div>`;
}
refreshMeter();
setInterval(refreshMeter, 5 * 60e3);
$("#theme").addEventListener("click", () => {
  setTheme(!ui.dark);
  store.set("ft-theme", ui.dark ? "dark" : "light");
  const p = planes.get(ui.selected);
  if (trailLine) trailLine.setStyle({ color: ui.dark ? "#6ea0ff" : "#2563eb" });
  if (p?.lk) drawRoute(p);
});
$("#collapse").addEventListener("click", () => { const t = $("#top"); t.classList.toggle("min"); $("#collapse").innerHTML = t.classList.contains("min") ? "&#9652;" : "&#9662;"; });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || document.activeElement === q) return;
  if (ui.selected) deselect(); else if (ui.airport) closeAirport();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadGlobal(); scheduleRegional(100); } });

/* ---------- shareable URL: #zoom/lat/lon[/hex] ---------- */
function parseHash() {
  const m = location.hash.match(/^#(\d{1,2})\/(-?[\d.]+)\/(-?[\d.]+)(?:\/([0-9a-f]{6}|[A-Z0-9]{4}))?/i);
  if (!m) return null;
  const x = m[4] || "";
  const isHex = /^[0-9a-f]{6}$/i.test(x);
  return { z: +m[1], lat: +m[2], lon: +m[3], hex: isHex ? x.toLowerCase() : null, apt: !isHex && x ? x.toUpperCase() : null };
}
function writeHash() {
  const c = map.getCenter().wrap();
  const h = `#${map.getZoom()}/${c.lat.toFixed(3)}/${c.lng.toFixed(3)}${ui.selected ? "/" + ui.selected : ui.airport ? "/" + ui.airport : ""}`;
  if (h !== location.hash) history.replaceState(null, "", h);
}
// Airports load at startup: the map draws them, and a shared link may open one.
loadAirports().then((d) => {
  buildAirportList(d);
  if (hash?.apt) selectAirport(hash.apt);
});
let pendingHex = hash?.hex || null;
const waitForHex = setInterval(() => {
  if (!pendingHex) return clearInterval(waitForHex);
  if (planes.has(pendingHex)) { select(pendingHex); pendingHex = null; }
}, 500);
setTimeout(() => { pendingHex = null; }, 30000);

/* ---------- start ---------- */
const savedTheme = store.get("ft-theme");
setTheme(savedTheme ? savedTheme === "dark" : !!window.matchMedia?.("(prefers-color-scheme: dark)").matches);
loadGlobal();
scheduleRegional(200);
</script>
</body>
</html>
